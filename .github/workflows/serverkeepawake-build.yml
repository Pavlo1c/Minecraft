name: NeoForge 21.1.265 (1.21.1)
run-name: NeoForge 21.1.265 (1.21.1)

on:
  push:
    paths:
      - "ServerKeepAwake/**"
      - ".github/workflows/serverkeepawake-build.yml"
    tags:
      - "serverkeepawake-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-neoforge-1-21-1:
    name: NeoForge 21.1.265 (1.21.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ServerKeepAwake/neoforge/1.21.1/21.1.265
    env:
      MOD_VERSION: 1.0.1
      MC_VERSION: 1.21.1
      NEOFORGE_VERSION: 21.1.265
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: ServerKeepAwake/neoforge/1.21.1/21.1.265/**/*.gradle*

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build mod
        run: gradle build --no-daemon

      - name: Prepare compatibility-labelled JAR
        run: |
          mkdir -p dist
          cp "build/libs/serverkeepawake-${MOD_VERSION}-all.jar" "dist/ServerKeepAwake-neoforge-MC${MC_VERSION}-NF${NEOFORGE_VERSION}-v${MOD_VERSION}.jar"
          test -s "dist/ServerKeepAwake-neoforge-MC${MC_VERSION}-NF${NEOFORGE_VERSION}-v${MOD_VERSION}.jar"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerKeepAwake-neoforge-MC${{ env.MC_VERSION }}-NF${{ env.NEOFORGE_VERSION }}-v${{ env.MOD_VERSION }}
          path: ServerKeepAwake/neoforge/1.21.1/21.1.265/dist/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/serverkeepawake-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ServerKeepAwake/neoforge/1.21.1/21.1.265/dist/*.jar
          generate_release_notes: true
